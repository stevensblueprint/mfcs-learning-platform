services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mfcs
      POSTGRES_USER: mfcs
      POSTGRES_PASSWORD: mfcs_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mfcs -d mfcs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: